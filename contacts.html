<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Code Connect - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-teal-300 to-blue-300 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a class="flex items-center text-white text-2xl font-bold" href="index.html">
                <img alt="Code Connect Logo" class="h-10 w-10 mr-2" src="https://storage.googleapis.com/a1aa/image/8UgUmOSyfiWXTqahgEDRmTJ5ycFapWYQNy710U5MfqRnzxtTA.jpg"/>
                Code Connect
            </a>
            <div class="space-x-4">
                <a class="text-white" href="index.html">Home</a>
                <a class="text-white" href="events.html">Events</a>
                <a class="text-white" href="chapters.html">Chapters</a>
                <a class="text-white" href="resources.html">Resources</a>
                <a class="text-white" href="sponsorship.html">Sponsorship</a>
                <a class="text-white" href="community.html">Community</a>
                <a class="text-white" href="contact.html">Contact Us</a>
                <a class="text-white" href="blog.html">Blog</a>
            </div>
        </div>
    </nav>
    
    <!-- Contact Us Section -->
    <section class="bg-gradient-to-r from-blue-300 to-teal-300 text-white py-20">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4">Contact Us</h1>
            <p class="text-xl mb-8">We'd love to hear from you! Reach out to us with any questions or inquiries.</p>
        </div>
    </section>
    <section class="py-20">
        <div class="container mx-auto">
            <form class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-lg">
                <div class="mb-4">
                    <input class="w-full p-3 rounded-lg border border-gray-300" placeholder="Your Name" type="text"/>
                </div>
                <div class="mb-4">
                    <input class="w-full p-3 rounded-lg border border-gray-300" placeholder="Your Email" type="email"/>
                </div>
                <div class="mb-4">
                    <textarea class="w-full p-3 rounded-lg border border-gray-300" placeholder="Your Message"></textarea>
                </div>
                <button class="bg-teal-500 text-white px-6 py-3 rounded-full font-bold hover:bg-teal-400 transition duration-300" type="submit">Send Message</button>
            </form>
        </div>
    </section>
    
    <!-- Footer -->
    <footer class="bg-gradient-to-r from-teal-300 to-blue-300 text-white py-6">
        <div class="container mx-auto text-center">
            <p>© 2023 Code Connect. All rights reserved.</p>
            <div class="mt-4 space-x-4">
                <a class="text-white" href="#"><i class="fab fa-facebook-f"></i></a>
                <a class="text-white" href="#"><i class="fab fa-twitter"></i></a>
                <a class="text-white" href="#"><i class="fab fa-instagram"></i></a>
                <a class="text-white" href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
